[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/packet",
    "crates/store",
    "crates/indexer",
    "crates/cli",
    "crates/mcp",
    "crates/adapters",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
# workspace members
middleman-core = { path = "crates/core" }
middleman-packet = { path = "crates/packet" }
middleman-store = { path = "crates/store" }
middleman-indexer = { path = "crates/indexer" }

# domain core
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting"] }
toml = "1"
ulid = { version = "3", features = ["serde"] }

# command line and logging
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# persistence and process edge
fs2 = "0.4"
rusqlite = { version = "0.40", features = ["bundled"] }

# deterministic parsing
regex = "1"

# development
proptest = "1"
tempfile = "3"

[workspace.lints.clippy]
pedantic = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
too_many_arguments = "allow"
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
strip = "symbols"
