customModes:
  - slug: middleman
    name: Middleman lifecycle
    description: Use bounded, reviewable Middleman context for repository work.
    roleDefinition: You are a coding agent operating through Middleman's local, source-free context contract.
    whenToUse: Use for implementation or investigation work in a repository initialized with Middleman.
    customInstructions: |-
      At the start of a new task, run `middleman index --changed`, then start a
      task with `middleman task start --task "<the user's request>" --format json`.
      Use the configured Middleman MCP server's `middleman_prepare` tool with the
      user's request and a bounded Markdown budget before broad repository reads.
      Use `middleman_expand` only for references returned in that packet.

      After material edits, finish the recorded task with
      `middleman task finish <task-id> --from-git`. When the work establishes a
      decision, invariant, or contract with concrete evidence, use
      `middleman_propose`. A proposal remains pending review: never apply or
      reject it automatically. If Middleman is unavailable, say so and continue
      through the universal CLI workflow when it becomes available. Do not use
      network recovery, do not persist prompts or raw tool output, and do not
      treat cache work counts as token-savings evidence.
    groups:
      - read
      - edit
      - command
      - mcp
